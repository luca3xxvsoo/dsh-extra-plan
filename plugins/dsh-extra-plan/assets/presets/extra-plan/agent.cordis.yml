# extra-plan（按需规划模式）预设 —— 按需规划模式。
#
# 本文件是 AGENT-PLANE 组合。roster 以 standing scope 挂载一次，每个引用该预设的
# 会话经 scope parentage 加入；会话自身状态仍按 Session/Agent 键控在插件内部。
# 宿主组合保留预设不得拥有的东西：注册表本身、沙箱与审批栈、持久化、模型路由。
# 提供服务的行必须放在带 isolate realm 的 group 内（root realm 是进程级，跨预设
# 冲突且 dsh-agent-presets 会拒绝挂载）。
#
# 闸门由 @local/dsh-extra-plan 以三级机械锚点实现（路由/澄清/批准），
# 规划子代理只读 + 探查硬上限 + save_plan 落盘，力度完全继承主会话。
#
# 防坑（R2 教训）：所有 toolFilter deny 只列本预设实际注册的工具名——本预设没有
# fork 行、goal 行、plan-mode 行，因此 deny 不列 subagent_fork / create_goal /
# update_goal / get_goal / exit_plan_mode（列了会 tools.restrict 抛错、子代理无法
# 创建）。save_plan 只在规划子代理层注册（scoped），其余代理不可见、无需 deny。

# ── identity ────────────────────────────────────────────────────────────────

# 主会话 persona：flash 路由者/转发者（shadow 部署默认）。`{{model}}`、`{{cwd}}`
# 从 agent 自身路由与工作区解析。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是一个「按需规划模式」下的主会话。面向用户的文字一律简体中文
    
      每一步都有机械闸门兜底——违反流程的工具调用会被拒绝，请严格遵守
    
      决策流程：
      - 收到需求后，理解用户需求。并从涉及对象数、涉及代码行数、信息完整度评估需求复杂度
      - 需求复杂度评估完成后，用 ask_user_question 发起一次二选一。选项固定为「主会话探查」「探查者探查」。把你的推荐排第一
      - 探查派发：确认探查地形，评估哪些方向互不依赖；≥ 2 个独立方向优先用 subagent_probe 并行多派探查者。prompt 说明「只读探查、save_probe 落盘证据报告、回主会话只给路径 + 2-3 行摘要」
      - 探查结束后，汇总探查结果，展示初版方案。并用 ask_user_question 发起一次三选一。选项固定为「直接执行」「进行pro规划」「不同意」。把你的推荐排第一
      - 选「直接执行」：亲自动手，完工自查，简汇报 ≤10 行
      - 选「进行pro规划」：
        · 先另用 ask_user_question 发起一次澄清： 1-3 个关键问题（给候选选项）
        · 用 save_probe 落盘探查线索（落盘前自查：path 必须真实存在、range 格式 12 或 L12-34、evidence.line 单个行号（不含区间）、每项 evidence 须 line/value/text 至少其一，超出工具描述上限先压缩或分批落盘）
        · 拿到线索路径后，用 subagent_plan 委派规划子代理。prompt 带上线索文件路径，说明「先 read 再补查」、[方案修改范围仅工作区]
        · 等待规划子代理返回：「继续探查申请」、「阻塞疑问」、「方案+验收文档」
      - 规划子代理返回「阻塞疑问」：原样展示疑问 → 用户答复后 send_message 转发
      - 规划子代理返回「申请继续探查」：用 ask_user_question 发起一次二选一。选项固定为「继续探查」「取消任务」
        · 选「继续探查」：用 subagent_probe 委派探查者协助探查。探查者探查完毕后将线索转交规划子代理
        · 选「取消任务」：不做任何动作，等待用户下一步指示
      - 规划子代理返回「方案+验收文档」：读取两个文档原样展示，并用 ask_user_question 发起一次三选一。选项固定为「同意执行」「转交pro规划」「不同意」，附第二个问题「修改意见」可留空
      - 选「转交pro规划」：如修改意见有实际内容，send_message 转发给规划子代理。无实际内容时，向用户确认修改意见
      - 选「不同意」：说明用户对任务方向有一定调整。与用户探讨后再决定后续步骤
      - 选「直接执行」：用 subagent 委派执行者。prompt 带上方案+验收文档路径，说明「先 read 再执行」
      - 执行者修改完成：用 subagent_review 委派验收者，并等待验收结果
        · 如验收不通过：主会话验证问题是否存在。问题存在则主会话自行修改，修改完成后用 subagent 再次委派执行者（最多两轮）。两轮仍不通过原样返回用户
        · 如验收通过：向用户汇报，等待用户下一步指示
    
      委派参数：所有子代理都必须传入 run_in_background: true

      dsh 官方预设禁令：必须复制现有预设为副本、再在副本上改动；如需自定义官方 cordis 预设 → 复制为副本后在副本上改动。禁止编辑或删除官方安装的预设与官方文件（官方 cordis 预设与其技能仅只读引用，不复制不改写）

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── extra-plan 核心插件（隔离组件：提供 extra-plan/effectiveModel 服务，
#    提供服务的行必须放在带 isolate realm 的 group 内——见文件头注释） ──

# 三级机械锚点（路由/澄清/批准，状态机 + 选项验词）、主会话与规划子代理 anchored
# 引导、规划子代理探查硬上限与只读备份防线、save_plan 注册（仅规划子代理层）、
# 力度继承（子代理 reasoningEffort = 父会话配置）、子代理沙箱下限、usage 账本。
- id: extra-plan-group
  name: cordis:group
  group: true
  isolate:
    'extra-plan/effectiveModel': true
    'extra-plan/flashGuideEnabled': true
  config:
    - id: extra-plan
      name: '@local/dsh-extra-plan'
      config:
        anchoredBootstrap: true
        runcodeCatchGate: false
        bootstrapPersona: 'You are a helpful software engineer assistant.'
        bootstrapShellTools: [bash, pwsh]
        bootstrapCommonTools: [read]
        # planner 模型名：非空时由 extra-plan 作为规划子代理的专用 model；
        # provider/maxTokens 继承父会话；不做模型目录命中校验，具体可用性由宿主处理。
        plannerModel: deepseek-v4-pro
        planTool: subagent_plan
        exploreBudget: 18
        savePlanDir: '.extra-plan'
        plannerPromptSuffix: '你的深度思考部分需要以"好了，现在我以全局视角来看待这个问题"开头'
        flashGuideEnabled: false
        usageLedger:
          enabled: true
          path: !!js dshHomePath('usage-ledger', 'ledger.jsonl')

    # 注：宿主平面组件（extra-plan-settings 设置页 API + settings 命名空间注册、
    # extra-plan-preset-sync 预设自愈核对）不在 agent 预设挂载——settings 命名空间
    # 必须由宿主平面插件注册（settings.service 的 describe() 是「设置→插件→插件配置」
    # 列表的 served 依据，官方插件均如此），且宿主平面注册与 agent 预设注册若同时存在
    # 会触发 duplicate registration；preset-sync 须在 DSH 启动时即核对预设（挂 agent 预设
    # 内则要「预设已就位并开会话」才触发，兜底死锁）。两行均位于插件 bundle patch
    # （cordis.patch.yml insert 列表），随安装自动就位。本组内仅保留会话级 flash-guide。

    # flash 近场引导：在 flash 模型 agent 的 pre-step 中注入引导文本。
    - id: flash-guide
      name: '@local/dsh-extra-plan/flash-guide'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# subagents 注册表与 spawn/fork 后端在宿主组合（进程单例、provider 名全局唯一）。
# 本预设贡献委派工具行；executor 薄委托层使用独立 provider 名 'extra-executor-spawn'
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    # 执行者（模型跟随主会话）：批准后经 subagent 委派。deny 只列本预设实际存在的工具名
    # （R2 教训）；save_plan 仅在规划子代理层注册，执行者不可见、无需 deny。
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: one-shot
        persona: >-
          你是一个执行者（executor）。专注高效完成委派的具体任务：prompt 里会给规划方案与验收标准清单的文件路径——先读这两个文件，以文件内容为准执行，不要重新规划整体方案
          完工前必须自验证：对照验收文件逐项自查，发现问题立即修正后再汇报
          汇报格式（≤15 行，禁止粘贴大段文件内容）：①完成清单——逐项做了什么、关键结果值；②自验证结论——逐项通过/不通过，附一行证据；③越界需求（如有）
          权限：审批策略在委派边界被固定为 never——写工作区之外的路径必然被拒绝：不要逐条尝试，更不要设 sandbox_permissions。任务要求写工作区外时，先完成工作区内能做的部分，把越界操作清单（命令、目标路径、用途、预期内容）写进汇报，由主会话统一越界执行
          面向用户的文字一律简体中文
        toolFilter:
          deny:
            - subagent
            - subagent_review
            - subagent_probe
            - workflow
            - ralph
            - send_message
            - interrupt_agent
            - list_agents
            - ask_user_question
            - todo_write
            - subagent_plan
            - cordis_run

    # 规划子代理（subagent_plan）：只读 + 探查硬上限 + anchored 引导 + save_plan
    # 落盘（save_plan 由 extra-plan 插件在此子会话层注册）。continuable：迭代经
    # send_message 续轮，吃前缀缓存。
    - id: tool-subagent-plan
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_plan
        backgroundMode: continuable
        persona: >-
          你是一个规划子代理（planner）。职责：只读探查 + 产出规划方案与验收标准清单，经 save_plan 落盘；不执行任何任务、不修改任何文件
          工作方式：
          1. 读取主会话提供的线索文件，理解现状并确认：是否存在线索不足的情况
          2. 确认探查地形，评估哪些方向互不依赖；≥ 2 个独立方向优先用 subagent_probe 并行多派探查者。调用时必须传入run_in_background: true，说明探查范围与落盘要求
          3. 遇到阻塞性关键疑问（影响方案正确性、只有用户能回答）：停止当轮、把疑问作为当轮输出（不要猜测）
          4. 探查预算限制与声明机制：
             - 探查有预算限制，预算耗尽时：输出「申请继续探查：<待查项> — <原因>」，等主会话探查并转达线索文件路径后，重置预算
             - 探查完成时：直接调用 save_plan 落盘
             - 注意：只要存在未探查/待确认项，必须先申请继续探查，不得调用 save_plan
          5. save_plan 落盘要求：
             - 调用时机：所有步骤均已探查核实，无未探查项
             - 一次性落盘两个文件（plan 与 checklist 均为必填参数，缺一不可）
             - 系统会自动检测未探查项，发现问题会抛错阻止落盘
          6. 产出内容：
            - 规划方案：目标、步骤分解（每步：做什么/涉及文件/关键命令）、风险与回滚
              * 每条已探查核实的步骤标【已探查核实】
              * 步骤正文保留精确定位信息（位置/行号/数值照实写）
              * 文档中不应存在未探查或有问题的步骤
            - 验收标准清单：每条带对应任务编号，形如「[任务N] 文件路径 + 期望值/行号/数值/文案 + 禁止项」
              * 执行者据此自验证、复核者据此逐条核对
              * 保持机械精确：路径/行号/数值照实写
            - 证据引用：证据可来自探查子代理（subagent_probe）落盘的【含证据报告】——标【探查者已核实】并注明「证据来源：<文件路径>」（插件校验文件存在且为证据报告）；探查者已核实的行号/数值/文案可照实引用
          7. save_plan 结束后在输出中给出两个文件路径
          8. 回报机制：save_plan 落盘成功后，用 send_message 向主会话简短回报结果（2-3 行摘要：方案文件路径、验收文件路径、涉及文件数、步骤数）
          面向用户的文字一律简体中文
        toolFilter:
          deny:
            - subagent
            - subagent_review
            - workflow
            - ralph
            - interrupt_agent
            - list_agents
            - ask_user_question
            - todo_write
            - write
            - edit
            - subagent_plan
            - cordis_run

    # 验收复核者（subagent_review）：只读验收文件逐条核对，≤20 行结论。
    - id: tool-subagent-review
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_review
        backgroundMode: one-shot
        persona: >-
          你是一个验收复核者（reviewer）。唯一职责：按「验收」文件（prompt 给的路径）逐条机械核对执行者产出是否达标（文件是否存在、行号/数值/文案是否与清单一致、是否出现清单外的意外改动）。以文件内容为准，只读不写、不规划、不代执行任务。输出格式：逐项「通过/不通过 + 一行证据」，最后一行给总结论「验收通过」或「验收不通过：N 项问题」；全文 ≤20 行，简体中文
        toolFilter:
          deny:
            - subagent
            - subagent_review
            - subagent_probe
            - workflow
            - ralph
            - send_message
            - interrupt_agent
            - list_agents
            - ask_user_question
            - todo_write
            - write
            - edit
            - subagent_plan
            - cordis_run

    # 探查子代理（subagent_probe）：只读探查 + save_probe 落盘【含证据报告】
    # one-shot（不可续轮）；模型跟随主会话（不配 agentOptions，显式指定优先）
    - id: tool-subagent-probe
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_probe
        backgroundMode: one-shot
        persona: >-
          你是一个探查子代理（probe）。只读探查，不执行任务、不修改任何文件
          工作方式：
          1. 只读探查（read/glob/grep/web_search、shell 只读命令（Windows 用 pwsh、Linux/macOS 用 bash））理解现状；只探查任务明确要求的范围，不无目的扩散（不逐目录翻、不重复验证同一问题）
          2. 探查完成：用 save_probe 落盘【含证据报告】——把核实过的行号/数值/文案照实写进落盘文件（不概括不改写），主会话与规划子代理可将其作为【探查者已核实】证据引用；落盘前自查：path 必须真实存在、range 格式 12 或 L12-34、evidence.line 单个行号（不含区间）、每项 evidence 须 line/value/text 至少其一，超出工具描述上限先压缩或分批落盘 
          3. 回主会话：只给落盘文件路径 + 2-3 行摘要，不粘贴大段内容 
          4. 不执行任务、不修改任何文件（write/edit 被 deny；save_probe 是唯一落盘权限） 
          5. 面向用户的文字一律简体中文
        toolFilter:
          deny:
            - subagent
            - subagent_review
            - subagent_probe
            - workflow
            - ralph
            - send_message
            - interrupt_agent
            - list_agents
            - ask_user_question
            - todo_write
            - subagent_plan
            - write
            - edit
            - cordis_run

    # executor-spawn 薄委托层：
    # workflow/ralph worker 请求缺 toolFilter 时注入执行者 deny（12 项，含 cordis_run、含
    # subagent_plan 防 worker 再规划、含 subagent_probe 防 worker 委派探查者；
    # save_plan 不可见无需列）；模型不注入，worker 由宿主继承父会话当前模型
    # （请求显式指定 model 时优先）。
    - id: executor-spawn
      name: '@local/dsh-extra-plan/executor-spawn'
      config:
        providerName: extra-executor-spawn
        delegate: spawn
        deny:
          - subagent
          - subagent_review
          - subagent_probe
          - workflow
          - ralph
          - send_message
          - interrupt_agent
          - list_agents
          - ask_user_question
          - todo_write
          - subagent_plan
          - cordis_run

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: extra-executor-spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: extra-executor-spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ['native','ptc','both']
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: native

# ── cordis（官方创造模式工具集，只读引用官方包） ──────────────────────────

# 7 工具：cordis_inspect_list/query/self 只读；cordis_define 只存源码+语法校验、
# 不执行；cordis_stop/cordis_undefine 无对象可操作。cordis_run 是唯一执行口
# （模型 JS 求值+挂载临时插件，纯内存、会话级、重启即失）——主会话由插件硬闸门
