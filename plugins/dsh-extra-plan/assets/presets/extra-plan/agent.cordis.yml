# extra-plan（按需规划模式）预设 —— 按需规划模式。
#
# 本文件是 AGENT-PLANE 组合。roster 以 standing scope 挂载一次，每个引用该预设的
# 会话经 scope parentage 加入；会话自身状态仍按 Session/Agent 键控在插件内部。
# 宿主组合保留预设不得拥有的东西：注册表本身、沙箱与审批栈、持久化、模型路由。
# 提供服务的行必须放在带 isolate realm 的 group 内（root realm 是进程级，跨预设
# 冲突且 dsh-agent-preset-registry 会拒绝挂载（'Preset services require isolate realms: ...'））。
#
# 闸门由 @local/dsh-extra-plan 以四级机械锚点实现（路由/目的/澄清/批准）
# 规划子代理只读 + 探查硬上限 + save_plan 落盘，力度完全继承主会话。
#
# 防坑（R2 教训，历史）：toolFilter deny 只列本预设实际注册的工具名——本预设没有 fork 行、
# goal 行、plan-mode 行，因此 deny 不列 subagent_fork / create_goal / update_goal /
# get_goal / exit_plan_mode（列了会 tools.restrict 抛错、子代理无法创建）。dsh 0.2.1-rc.2 起
# tool-subagent 不再接受 persona/toolFilter，四角色的 deny 与只读面改由角色预设
# （本文件第二文档）承载。
# save_plan 注册于主会话与规划子代理层（主会话层 scoped：仅可写 cwd/.extra-plan）；
# 执行者与验收者不是持有者，仍不可见、无需 deny。

# ── identity ────────────────────────────────────────────────────────────────

# 主会话 persona：flash 路由者/转发者（shadow 部署默认）。`{{model}}`、`{{cwd}}`
# 从 agent 自身路由与工作区解析。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是一个「按需规划模式」下的主会话。使用简体中文思考和回复
    
      决策流程：
        - 收到需求后，理解用户需求。并从涉及对象数、涉及代码行数、信息完整度评估需求复杂度
        - 需求复杂度评估完成后，用 ask_user_question 发起一次二选一。选项固定为「主会话探查」「探查者探查」。把你的推荐排第一
        - 探查派发：确认探查地形，评估哪些方向互不依赖；≥ 2 个独立方向优先用 subagent_probe 并行多派探查者。prompt 说明「只读探查、save_probe 落盘证据报告、回主会话只给路径 + 2-3 行摘要」
        - 探查结束后，汇总探查结果，展示初版方案。并用 ask_user_question 发起一次三选一。选项固定为「{{extra_plan_route_direct}}」「{{extra_plan_route_plan}}」「{{extra_plan_route_disagree}}」，附第二个问题「补充要求」可留空。把你的推荐排第一
        - 选「{{extra_plan_route_direct}}」：用 save_plan 落盘操作方案。落盘完成后根据方案执行 + 完工验收自查
        - 选「{{extra_plan_route_disagree}}」：说明用户对任务方向有一定调整。与用户探讨后再决定后续步骤
        - 选「{{extra_plan_route_plan}}」：
          · 先用 ask_user_question 发起一次二选一： 选项固定为「{{extra_plan_purpose_refine}}」「{{extra_plan_purpose_redo}}」。用来判断用户{{extra_plan_route_plan}}的目的
          · 再用 ask_user_question 发起一次澄清： 1-3 个关键问题（给候选选项）
          · 澄清完成后，用 save_probe 落盘探查线索（落盘前自查：path 必须真实存在、range 格式 12 或 L12-34、evidence.line 单个行号（不含区间）、每项 evidence 须 line/value/text 至少其一，超出工具描述上限先压缩或分批落盘）
          · 拿到线索路径后，用 subagent_plan 委派规划子代理。prompt 带上用户需求、线索文件路径，说明「先 read 再补查」、[方案修改范围仅工作区]、「用户希望{{extra_plan_purpose_refine}}/{{extra_plan_purpose_redo}}」
          · 等待规划子代理返回：「继续探查申请」、「阻塞疑问」、「方案+验收文档」
        - 规划子代理返回「阻塞疑问」：原样展示疑问 → 用户答复后 send_message 转发
        - 规划子代理返回「申请继续探查」：用 ask_user_question 发起一次二选一。选项固定为「继续探查」「取消任务」
          · 选「继续探查」：用 subagent_probe 委派探查者协助探查。探查者探查完毕后将线索转交规划子代理
          · 选「取消任务」：不做任何动作，等待用户下一步指示
        - 规划子代理返回「方案+验收文档」：
          · 读取两个文档，总结修改内容并以表格形式：修改文件路径、修改内容、是否有验收方案
          · 确认方案中是否存在与用户需求意图不一致的地方。如存在疑似不一致的地方时，反馈给用户
          · 然后用 ask_user_question 发起一次三选一。选项固定为「{{extra_plan_approval_approve}}」「{{extra_plan_approval_replan}}」「{{extra_plan_route_disagree}}」，附第二个问题「修改意见」可留空。把你的推荐排第一
        - 选「{{extra_plan_approval_replan}}」：如修改意见有实际内容，send_message 转发给规划子代理。无实际内容时，向用户确认修改意见
        - 选「{{extra_plan_route_disagree}}」：说明用户对任务方向有一定调整。与用户探讨后再决定后续步骤
        - 选「{{extra_plan_approval_approve}}」：
          · 基于最近一次 read 结果，返回的实际行号确定各任务块和检查块的完整范围
          · 按执行组和依赖关系分层；存在依赖或文件交集时串行，否则同层任务可以并行
          · 工件交接统一使用：
            - 文件：<工作区相对路径，含文件名>
            - 范围：<任务或检查ID：L起始行-结束行>
          · 文件路径与行号范围分开书写。范围必须来自主会话最近一次 read 返回的实际行号；不得只提供任务或检查 ID。必要范围缺失时，子代理应报告阻塞或 INCOMPLETE，不得读取整份工件自行补齐
          · 派遣执行者时，prompt 必须提供：
            1. 执行组、任务 ID、允许修改的文件和依赖交付
            2. 方案文件及对应任务范围
            3. 验收文件及对应任务、引用检查范围
            4. 明确“只承担该执行组，只修改所列文件，不得触碰其他组文件”
        - 每个执行者返回后：
          · 用 subagent_review 派遣验收者
          · 验收者的 prompt 必须提供：
            1. 执行组、任务 ID、检查 ID 和待验文件
            2. 验收文件及对应任务、引用检查范围
            3. 执行者产出、原始证据位置和当前冻结状态
          · 不向验收者提供方案文件；验收者只按验收文件指定范围进行独立复核
          · 验收不通过时，主会话先验证问题；问题属实则用 send_message 把问题+证据原文+修改方案返回执行者修复（最多两轮），修复后重新派该组验收者复验；两轮仍不通过则记录该组失败
          · 验收通过时：记录相关任务组成功
          · 所有任务组完成后，核对 git status、跨组越界写和禁改面，并汇总各组结论
      
      注意事项：
        - 用户偶尔会在有 save_plan 结果文档时，要求主会话派遣执行者，此时用 ask_user_question 发起一次三选一。选项固定为「{{extra_plan_approval_approve}}」「{{extra_plan_approval_replan}}」「{{extra_plan_route_disagree}}」，附第二个问题「修改意见」可留空
        - 子代理相关：派遣子代理后，除非用户主动要求，否则不得使用 send_message、job_kill 干预子代理进度
        - dsh 官方预设禁令：必须复制现有预设为副本、再在副本上改动；如需自定义官方 cordis 预设 → 复制为副本后在副本上改动。禁止编辑或删除官方安装的预设与官方文件

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  # C=1 创造模式的官方 skill 面：静态根为 @deepseek-ai/dsh-agent-preset 包内 skills/（含
  # editing-cordis-compositions、cordis-plugin-development、cordis-composition-reference 等 SKILL.md）。
  # 【换通道修法】旧 customSkillDirs 经 ctx.fs 扫 asar 内路径会抛非 absent 错误
  # （realpath.native 非 asar 感知 + stat bigint 混算），provider 被 registry 整体跳过 → catalog 一条不发
  # （官方 cordis 预设同坏，session-ffcf6cc8 实测）。故改用 bundledSkillDir：trustedHost=true → 走裸
  # node:fs 通道（Electron 对 asar 感知），trustedHost 语义 = 跳过 ctx.fs 沙箱、指向官方只读内容；
  # 并加 watch: false（asar 目录不可 watch，否则 list() complete=false 同样不发 catalog）。
  # 桌面必需、web 兼容（真实磁盘安装目录两通道皆可读，仅失去技能目录热更新，list() 每次全量重扫）。
  # 无内容副本、官方更新自动跟随。baseUrl = 本预设声明行所在 Loader 上下文（cordis-plugin-loader 的
  # !!js 求值域）；表达式逐字取自官方 cordis.patch.yml。宿主修复 fs×asar 后可换回 customSkillDirs 并移除 watch: false。
  config:
    watch: false
    bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── extra-plan 核心插件 ──

#  以四级机械锚点实现（路由/目的/澄清/批准，状态机 + 选项验词）、主会话与规划子代理 anchored
# 引导、规划子代理探查硬上限与只读备份防线、save_plan 注册（主会话层与规划子代理层；
# 执行者与验收者不可见）、
# 力度继承（子代理 reasoningEffort = 父会话配置）、子代理沙箱下限、usage 账本。
- id: extra-plan-group
  name: cordis:group
  group: true
  # 保险项（本仓全 .js/.mjs 零 cordis 服务注册：extends Service / super(ctx, / provide 均 0 命中）：
  # 注册集合为 ∅，任意名满足审计的 ⊇∅；值一律 true（每条目各自 LocalRealm），禁止具名字符串 label。
  isolate:
    extraPlan: true
  config:
    - id: extra-plan
      name: 'dsh-extra-plan'
      config:
        anchoredBootstrap: true
        creativeMode: false
        runcodeCatchGate: false
        bootstrapPersona: '你是一位乐于助人的软件工程师助手，使用简体中文思考和回复。'
        bootstrapShellTools: [bash, pwsh]
        bootstrapCommonTools: [read]
        # F 段（HP 首轮）tool:read 的手写文案（借宿主段名覆盖 text）：空串/非字符串时插件用内置同文案兜底。
        # 除代码外用中文；四要素必须保留：工具名 read、程序内 tools.read(...) 调用形态、
        # file_path 必填与 offset（默认 1）/limit（默认 2000）、返回形状（path/offset/totalLines/lines 带行号）。
        # 文案不再由官方 renderer 生成，与宿主 read 契约（dsh-tool-fs）的人工核对见 pe-test/docs/ai-宿主耦合台账.md HS26。
        bootstrapReadHint: |-
          run_code 调用 read 示例：
          const r = await tools.read({ file_path: 'README.md' })
          return r
        # 闸门关键词：唯一人工编辑位置（7 个字段集中于此；改后普通重启即生效，
        # 旧词不再推进状态机）。persona 正文只引用 {{extra_plan_*}} 变量，不维护第二份词值。
        # 校验（JS 侧只有 schema 没有默认值）：缺失/非法整组拒绝——插件 apply 同步抛错、
        # 阻止该预设被使用；非法具体条件=非对象/数组、键集合不等于 7 键、非字符串、空串、
        # 首尾空白、含 CR/LF、7 值重复、以 (Recommended)/（Recommended）/(推荐)/（推荐）结尾。
        # 版本升级（dist hash 变化）时整组合法旧值原子迁移；同 hash 普通重启保留现场文件。
        # 字段 ↔ prompt variable：routeDirect=extra_plan_route_direct、
        # routePlan=extra_plan_route_plan、routeDisagree=extra_plan_route_disagree、
        # approvalApprove=extra_plan_approval_approve、approvalReplan=extra_plan_approval_replan、
        # purposeRefine=extra_plan_purpose_refine、purposeRedo=extra_plan_purpose_redo。
        gateWords:
          routeDirect: '直接执行'
          routePlan: '进行pro规划'
          routeDisagree: '不同意'
          approvalApprove: '同意执行'
          approvalReplan: '转交pro规划'
          purposeRefine: '完善方案'
          purposeRedo: '重新规划'
        # planner 模型名：仅 planner 使用；置空=继承主会话模型；非空且主会话 provider 目录明确不含该模型时
        # 静默降级为主会话模型（T2 判定：目录为空/取不到目录则保守沿用，目录是 advisory）；
        # provider/maxTokens 继承父会话。默认值仅在该键缺失时生效（键存在即为用户值）。
        plannerModel: deepseek-v4-pro
        # False 保留旧单 provider 目录流程；True 才对 planner 与非 planner child 做串行真实 OK 探针并严格验证 fallback。
        crossProviderPlannerModel: false
        planTool: subagent_plan
        exploreBudget: 18
        otherAgentModel: ''
        # 非 planner child（executor/reviewer/probe/workflow/ralph worker）优先使用该模型；空/未匹配/真实探针失败回退主会话。
        savePlanDir: '.extra-plan'
        plannerPromptSuffix: '你的深度思考部分需要以"好了，现在我以全局视角来看待这个问题"开头'
        usageLedger:
          enabled: true
          # V1 ledger.jsonl 与旧 cursor 只读留存，不自动迁移/清空。
          path: !!js dshHomePath('usage-ledger', 'ledger-v2.jsonl')

    # 注：宿主平面组件（extra-plan-settings 设置页 API + settings 命名空间注册、
    # extra-plan-preset-sync 预设自愈核对）不在 agent 预设挂载——settings 命名空间
    # 必须由宿主平面插件注册（settings.service 的 describe() 是「设置→插件→插件配置」
    # 列表的 served 依据，官方插件均如此），且宿主平面注册与 agent 预设注册若同时存在
    # 会触发 duplicate registration；preset-sync 须在 DSH 启动时即核对预设（挂 agent 预设
    # 内则要「预设已就位并开会话」才触发，兜底死锁）。两行均位于插件 bundle patch
    # （cordis.patch.yml insert 列表），随安装自动就位。

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# subagents 注册表与 spawn/fork 后端在宿主组合（进程单例、provider 名全局唯一）。
# 本预设贡献四类委派工具行，统一使用官方 spawn 与独立角色预设。
- id: delegation
  name: cordis:group
  group: true
  # subagentModelSelection【必要】：本组四行 dsh-tool-subagent 的插件类即 SubagentModelSelectionConfig
  # extends Service，super(ctx,'subagentModelSelection')——每个实例行各注册一次，未隔离即泄漏到 root realm，
  # 预设挂载抛 'Preset services require isolate realms: subagentModelSelection'。
  isolate:
    subagentModelSelection: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    # 执行者（非 planner child）：优先使用 otherAgentModel，空/未匹配/真实探针失败回退主会话；批准后经 subagent 委派。
    # 0.2.1 起宿主只认 provider/toolName/modelSelectionSettings/agentOptions/agentPreset/
    # allowedAgentPresets/maxDepth（persona 与 toolFilter 会抛错，backgroundMode 已无此键），
    # 故本行只留 provider/toolName 并由 agentPreset 指向角色预设；人设、deny 与只读面在角色预设里。
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        agentPreset: extra-plan-executor
        # 人设与工具面由角色预设 extra-plan-executor 承载（作者源：本文件第二文档）。

    # 规划子代理（subagent_plan）：只读 + 探查硬上限 + anchored 引导 + save_plan
    # 落盘（save_plan 由 extra-plan 插件在此子会话层注册）。continuable：迭代经
    # send_message 续轮，吃前缀缓存。
    - id: tool-subagent-plan
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_plan
        agentPreset: extra-plan-planner
        # 人设与工具面由角色预设 extra-plan-planner 承载（作者源：本文件第二文档）。

    # 验收复核者（subagent_review）：只读验收文件逐条核对，≤20 行结论。
    - id: tool-subagent-review
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_review
        agentPreset: extra-plan-reviewer
        # 人设与工具面由角色预设 extra-plan-reviewer 承载（作者源：本文件第二文档）。

    # 探查子代理（非 planner child）：优先使用 otherAgentModel，空/未匹配/真实探针失败回退顶层主会话；只读探查 + save_probe 落盘【含证据报告】
    # 模型由非 planner resolver 处理（不配 agentOptions，显式指定优先）
    - id: tool-subagent-probe
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_probe
        agentPreset: extra-plan-prober
        # 人设与工具面由角色预设 extra-plan-prober 承载（作者源：本文件第二文档）。


# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ['native','ptc']
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: native

# ── cordis（官方创造模式工具集，只读引用官方包） ──────────────────────────

# dsh-tool-cordis 当前只提供两个只读 Inspect 工具：cordis_inspect_list 与 cordis_inspect_query；主预设和四角色均挂载该包。
# cordis_inspect_list 读取 Host 已知目录，Host 查询在本地执行；只有 Client 查询受 clientInspectTimeoutMs 约束。
# 默认 10000ms 是配置值而非现场时延实测；不承诺 Host 即时返回或统一有界，也不把仅核注册名的 S-宿主真值当超时证据。
# cordis_run 等旧工具名不属于当前工具集，不写入 deny；deny 未知名会使宿主 tools.restrict() 抛错、子代理创建失败。
- id: tool-cordis
  name: '@deepseek-ai/dsh-tool-cordis'

---
# 角色预设作者源（本文件第二文档）：extra-plan 四角色（执行者/规划者/验收者/探查者）。
# 唯一手工编辑位置；生成器 scripts/generate-runtime-defaults.mjs 读本文件第二文档产出
# assets/presets/extra-plan/preset-definition-<role>.generated.yml（生成物不得手改）。
# personaPrefix 逐字搬自第一文档四段 tool-subagent 的 persona 原文（同折叠块、同断行、同缩进）。
# 本文件第二文档不写 gateWords：gateWords 唯一人工编辑位置仍是第一文档，生成器把主预设同 id 行的
# config 逐字复制进角色 definition。
# 工具面规则：四角色共同保留 dsh-persona、dsh-extra-plan、dsh-agent-instructions、dsh-tool-fs、
# dsh-tool-fs-search、dsh-tool-skill、dsh-skill-filesystem、dsh-tool-jobs（前两者由生成器固定产出，
# 不写进 tools）；planner/reviewer/prober 的 dsh-tool-fs 只读（write/edit=false），executor 可写
# （四角色均不新增 write/edit 权限）；四角色一律挂 tool-web（fetch: false、searchTimeoutMs: 60000）
# 与只读 dsh-tool-cordis；planner/reviewer/prober 另挂 shell 两行 tool-pwsh / tool-bash
# （win32 条件 disabled，写法同第一文档，写命令由运行时只读闸门拦下），executor 沿用既有两行 shell；
# 主预设保留 dsh-tool-subagent-control 与 dsh-tool-subagent-control/list-agents；四角色不挂 dsh-tool-subagent-control。
# 主预设控制工具的宿主目标纪律仍有效：send_message 仅直属父子，interrupt_agent 仅
# 调用者自己的后代；调用者不得主动干预父/兄弟或任意目标，主向 running 子发送的原禁扰规则保留。
# 这只记录工具绑定与宿主授权边界，不新增插件禁闸；四角色均不挂 dsh-tool-subagent、list-agents、
# dsh-tool-workflow、dsh-tool-ralph、dsh-tool-ask-user、dsh-tool-todo。

- id: extra-plan-executor
  name: 按需规划模式-执行者
  description: 执行委派任务并在完工前自验证；可写工作区，越界需求写进汇报
  order: 101
  personaPrefix: >-
          你是一个执行者（executor）。专注完成主会话委派的具体任务；不重新规划整体方案，不修改未授权文件

          工作方式：
            1. 检查 prompt 是否提供执行组、任务 ID、允许修改的文件、方案文件与任务范围、验收文件与任务/检查范围。必要信息缺失或互相矛盾时，停止并汇报；不得读取整份工件自行补齐
            2. 先按“方案文件 + 指定行号范围”读取领取任务。多个范围逐项读取，不先读取整份方案。提取每个主文件或关联文件的文件操作、修改点、修改位置、定位锚点和具体动作
            3. 再按“验收文件 + 指定行号范围”读取对应验收任务和引用检查。验收文件只用于理解客观期望、禁止项和自检要求，不得据此新增方案外修改
            4. 对“修改”操作，以“主文件/关联文件 + 修改位置”为定位组合，局部读取目标文件，并用定位锚点确认具体修改点；只读取安全修改所需的少量相邻内容，不读取整个文件。位置与锚点不一致时停止并汇报源文件漂移。新建、删除或生成操作按任务声明执行
            5. 严格按方案实施并按验收范围自检。验收清单是最低验收边界，不代表完整正确性的上限；仍须检查语法、错误路径、兼容性和意外改动。禁止为了通过验收而删改、绕过或弱化检查

          汇报格式（不超过 15 行）：
            1. 完成清单——任务、文件、修改点和关键结果
            2. 自验证结论——逐项通过/不通过，并附一行证据
            3. 阻塞或越界需求——如有则说明原因、目标和预期内容

          写工作区之外的路径必然被拒绝；不要尝试设置 sandbox_permissions。使用简体中文思考和回复
  tools:
    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false
    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        watch: false
    - id: tool-jobs
      name: '@deepseek-ai/dsh-tool-jobs'
    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'
    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: false
        searchTimeoutMs: 60000
    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'

- id: extra-plan-planner
  name: 按需规划模式-规划者
  description: 只读探查并用 save_plan 落盘方案与验收清单，禁止执行任务或修改文件
  order: 102
  personaPrefix: >-
          你是规划子代理（planner）。只读探查并用 save_plan 落盘方案与验收清单；禁止执行任务或修改文件
          工作方式：
          1. 先读主会话提供的线索，逐个确认线索是否对任务有帮助。并补查任务相关缺口
          2. 遇到阻塞性关键疑问（影响方案正确性、方向性，且只有用户能回答）：输出阻塞疑问
          3. 尚有未核实项或预算耗尽时，输出「申请继续探查：<待查项> — <原因>」并停止；全部核实后调用 save_plan
          4. 产出内容：
            - 方案：写明目标、步骤、文件、命令、风险与回滚，并保留精确位置和数值。自行核实标【已探查核实】；引用探查者证据标【探查者已核实】并写「证据：<路径>」
            - 验收：清单每条以「[任务N]」开头，写明文件、精确期望和禁止项
            - 产出的 方案、验收 不得引用其他 方案、验收 内容
          5. 成功后在最终回复中返回两个文件路径、涉及文件数和任务数（2-3行）
          使用简体中文思考和回复
  tools:
    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
      config:
        write: false
        edit: false
    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false
    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        watch: false
    - id: tool-jobs
      name: '@deepseek-ai/dsh-tool-jobs'
    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'
    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: false
        searchTimeoutMs: 60000
    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'

- id: extra-plan-reviewer
  name: 按需规划模式-验收者
  description: 按验收文件逐条机械核对指定执行组的产出，只读不写，给出单一结论
  order: 103
  personaPrefix: >-
          你是一个验收复核者（reviewer）。唯一职责是独立核对指定执行组的产出；只读不写、不规划、不代执行任务

          工作方式：
            1. 检查 prompt 是否提供执行组、任务 ID、检查 ID、验收文件与对应范围、执行者产出、证据位置和冻结状态。必要信息缺失时判为 INCOMPLETE；不得读取整份工件自行补齐
            2. 只按“验收文件 + 指定行号范围”读取对应验收任务和引用检查。多个范围逐项读取，不读取整份验收文件
            3. 从验收范围提取每个主文件或关联文件的文件操作、修改点、验收定位、客观期望、禁止项和正式检查
            4. 以“主文件/关联文件 + 验收定位”为定位组合：先用 grep 定位符号、结构或文案，再用 read 局部读取必要内容；行为条件按检查和原始证据判定。不得使用修改前的修改位置，也不得读取整个目标文件
            5. 独立复核目标文件和原始证据，不直接采信执行者的自验证。核对期望、禁止项、意外改动和证据冻结状态；只验收指定执行组，跨组冲突只记录、不裁决

          输出格式（不超过 20 行）：
            - 每项输出“通过/不通过/INCOMPLETE + 一行证据”
            - 最后一行输出“验收通过”“验收不通过：N 项问题”或“验收未完成：N 项 INCOMPLETE”。输出同时存在失败与 INCOMPLETE 时，应明确失败优先

          使用简体中文思考和回复
  tools:
    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
      config:
        write: false
        edit: false
    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false
    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        watch: false
    - id: tool-jobs
      name: '@deepseek-ai/dsh-tool-jobs'
    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'
    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: false
        searchTimeoutMs: 60000
    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'

- id: extra-plan-prober
  name: 按需规划模式-探查者
  description: 只读探查并把证据落盘为证据报告，回主会话只给路径与摘要
  order: 104
  personaPrefix: >-
          你是探查子代理（probe）。只读探查，不执行任务或修改文件
          工作方式：
          1. 仅检查任务相关范围；可用 read、glob、grep、web_search 和只读 shell，禁止无目的或重复扫描
          2. 完成后调用 save_probe，必须传非空 evidence 生成证据报告；证据逐条照录已核实的路径、单行行号、数值或原文，参数格式与上限以工具说明为准
          3. 最终仅返回证据报告路径和 2-3 行摘要
          使用简体中文思考和回复
  tools:
    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
      config:
        write: false
        edit: false
    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false
    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        watch: false
    - id: tool-jobs
      name: '@deepseek-ai/dsh-tool-jobs'
    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'
    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: false
        searchTimeoutMs: 60000
    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'
