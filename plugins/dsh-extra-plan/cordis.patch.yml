# 宿主平面 bundle patch（随安装自动就位）+ 本包自有状态初始化：
#  - 预设本体（extra-plan 组合）由 assets/presets/extra-plan/preset-patch.generated.yml
#    提供（dsh 0.1.7-rc.1 新载体 = profile patch 根级 insert 一行 preset-extra-plan 声明行，
#    name: '@deepseek-ai/dsh-agent-preset'，config.plugins = agent.cordis.yml 顶层条目逐字）；
#    两份 patch 由 package.json dsh.bundle.patch 数组按序装载。旧的
#    $DSH_HOME/.agent-presets/extra-plan 目录分发链已退役：0.1.7 宿主无任何读取方。
#  - postinstall（scripts/distribute-preset.mjs）只初始化插件自有状态目录
#    $DSH_HOME/.agent-presets/extra-plan/（dist-manifest.json 审计台账）；预设内容迁移/
#    启动自愈由 lib/preset-sync.js 经 configEditor 完成（写盘只走 configEditor.edit）。
#
# v0.1.2-rc1 迁移（0d435c0）曾把 preset-sync/settings 挪出本 bundle patch；本版
# 已回归——宿主平面组件必须随 bundle patch 注册才「安装即用」：settings 是 web
# 服务级单例（挂 agent 预设会 duplicate registration），preset-sync 须在 DSH 启动时
# 即核对预设（挂在 agent 预设内则要「预设已就位并开会话」才触发，兜底死锁）。
#
# 本 bundle patch 注册三个宿主平面组件：
#  - dsh-extra-plan-client-bridge：一个相对路径空壳插件行，指向本包内的
#    lib/client-bridge.js（不新建包，功能全部留在 @local/dsh-extra-plan 内）。
#    作用是让 clientModules 扫描到本包 package.json 的 dsh.client 声明并加载
#    lib/client.js（设置页卡片 UI）。
#  - dsh-extra-plan-settings：设置页 API + settings 命名空间（服务级单例，须宿主平面）。
#    该行 id 就是 settings 命名空间名（SettingsForms/plugins.item 的 ns），
#    也是 live-config 定位的配置文件行 id。
#  - extra-plan-preset-sync：启动时核对 preset-extra-plan 声明行与资产 hash
#    （postinstall 被 pnpm 阻止 / 预设缺失 / 跨版本分发时的兜底）。
# 原理（读 dsh-app-boot 源码 anchorInsertedPluginNames 确认）：
#   - patch 行里 ./ 开头的相对路径会被绝对化为「相对于本 patch 文件所在目录」
#     （即 @local/dsh-extra-plan/ 包目录），所以写 './lib/client-bridge.js'。
#   - v0.1.2-rc1 的 clientModules.exactPackageSpecifier 拒绝 @scope/pkg/subpath 形态
#     （@local/dsh-extra-plan/settings 返回 undefined 被跳过），而绝对化后的
#     file: URL 行（pathLike）会走 nearestPackage 向上找到本包 package.json
#     → 读 dsh.client 声明 → exports["./client"] → lib/client.js。
#   - 与 profile 用户层 dsh-memory 的 name: ./plugins/memory/index.js 是同一模式。
- insert:
    - id: dsh-extra-plan-client-bridge
      name: './lib/client-bridge.js'
    - id: dsh-extra-plan-settings
      name: '@local/dsh-extra-plan/settings'
    - id: extra-plan-preset-sync
      name: '@local/dsh-extra-plan/preset-sync'
- insert:
    - id: dsh-extra-plan-client-bridge
      name: './lib/client-bridge.js'
    - id: dsh-extra-plan-settings
      name: '@local/dsh-extra-plan/settings'
    - id: extra-plan-preset-sync
      name: '@local/dsh-extra-plan/preset-sync'
- insert:
    - id: preset-extra-plan
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: extra-plan
        name: '按需规划模式'
        description: '可交互式进入pro模型规划，适合交互式vibe coding，不适合wish coding。'
        order: 100
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: &personaText >-
                你是一个「按需规划模式」下的主会话。使用简体中文思考和回复
              
                决策流程：
                  - 收到需求后，理解用户需求。并从涉及对象数、涉及代码行数、信息完整度评估需求复杂度
                  - 需求复杂度评估完成后，用 ask_user_question 发起一次二选一。选项固定为「主会话探查」「探查者探查」。把你的推荐排第一
                  - 探查派发：确认探查地形，评估哪些方向互不依赖；≥ 2 个独立方向优先用 subagent_probe 并行多派探查者。prompt 说明「只读探查、save_probe 落盘证据报告、回主会话只给路径 + 2-3 行摘要」
                  - 探查结束后，汇总探查结果，展示初版方案。并用 ask_user_question 发起一次三选一。选项固定为「{{extra_plan_route_direct}}」「{{extra_plan_route_plan}}」「{{extra_plan_route_disagree}}」，附第二个问题「补充要求」可留空。把你的推荐排第一
                  - 选「{{extra_plan_route_direct}}」：亲自动手，完工自查，简汇报 ≤10 行
                  - 选「{{extra_plan_route_disagree}}」：说明用户对任务方向有一定调整。与用户探讨后再决定后续步骤
                  - 选「{{extra_plan_route_plan}}」：
                    · 先用 ask_user_question 发起一次二选一： 选项固定为「{{extra_plan_purpose_refine}}」「{{extra_plan_purpose_redo}}」。用来判断用户{{extra_plan_route_plan}}的目的
                    · 再用 ask_user_question 发起一次澄清： 1-3 个关键问题（给候选选项）
                    · 澄清完成后，用 save_probe 落盘探查线索（落盘前自查：path 必须真实存在、range 格式 12 或 L12-34、evidence.line 单个行号（不含区间）、每项 evidence 须 line/value/text 至少其一，超出工具描述上限先压缩或分批落盘）
                    · 拿到线索路径后，用 subagent_plan 委派规划子代理。prompt 带上用户需求、线索文件路径，说明「先 read 再补查」、[方案修改范围仅工作区]、「用户希望{{extra_plan_purpose_refine}}/{{extra_plan_purpose_redo}}」
                    · 等待规划子代理返回：「继续探查申请」、「阻塞疑问」、「方案+验收文档」
                  - 规划子代理返回「阻塞疑问」：原样展示疑问 → 用户答复后 send_message 转发
                  - 规划子代理返回「申请继续探查」：用 ask_user_question 发起一次二选一。选项固定为「继续探查」「取消任务」
                    · 选「继续探查」：用 subagent_probe 委派探查者协助探查。探查者探查完毕后将线索转交规划子代理
                    · 选「取消任务」：不做任何动作，等待用户下一步指示
                  - 规划子代理返回「方案+验收文档」：
                    · 读取两个文档，总结修改内容并以表格形式：修改文件路径、修改内容、是否有验收方案
                    · 确认方案中是否存在与用户需求意图不一致的地方。如存在疑似不一致的地方时，反馈给用户
                    · 然后用 ask_user_question 发起一次三选一。选项固定为「{{extra_plan_approval_approve}}」「{{extra_plan_approval_replan}}」「{{extra_plan_route_disagree}}」，附第二个问题「修改意见」可留空。把你的推荐排第一
                  - 选「{{extra_plan_approval_replan}}」：如修改意见有实际内容，send_message 转发给规划子代理。无实际内容时，向用户确认修改意见
                  - 选「{{extra_plan_route_disagree}}」：说明用户对任务方向有一定调整。与用户探讨后再决定后续步骤
                  - 选「{{extra_plan_approval_approve}}」：用 subagent 委派执行者。prompt 带上方案+验收文档路径，说明「先 read 再执行」
                  - 执行者修改完成：用 subagent_review 委派验收者，并等待验收结果
                    · 如验收不通过：主会话验证问题是否存在。问题存在则主会话自行修改，修改完成后用 subagent 再次委派执行者（最多两轮）。两轮仍不通过原样返回用户
                    · 如验收通过：向用户汇报，等待用户下一步指示
              
                委派参数：所有子代理都必须传入 run_in_background: true

                dsh 官方预设禁令：必须复制现有预设为副本、再在副本上改动；如需自定义官方 cordis 预设 → 复制为副本后在副本上改动。禁止编辑或删除官方安装的预设与官方文件（官方 cordis 预设与其技能仅只读引用，不复制不改写）
              # 兼容 DSH 0.1.2-rc.1 的旧必填键：0.1.3-alpha.2 起宿主 dsh-persona 改用 prefix（必填）。
              # 与上方 prefix 为同一段文本（锚点引用）；删除条件＝不再需要支持 0.1.2-rc.1。详见台账 ⑧ 节。
              text: *personaText

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ─────────────────────────────────────────────────────────

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            # C=1 创造模式的官方 skill 面（dsh 0.1.7-rc.1）：不再由插件运行期 agentPresets.resolve('cordis')
            # 取 path 后 skills.register（0.1.7 该 resolve 只返回 {id[,broken]}，path 恒 undefined），改为官方替身
            # 的静态根：@deepseek-ai/dsh-agent-preset 包内 skills/（含 editing-cordis-compositions、
            # cordis-plugin-development、cordis-composition-reference 三个 SKILL.md）。baseUrl = 本预设声明行所在
            # Loader 上下文（cordis-plugin-loader 的 !!js 求值域），表达式逐字取自官方 cordis.patch.yml。
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── extra-plan 核心插件 ──

          #  以四级机械锚点实现（路由/目的/澄清/批准，状态机 + 选项验词）、主会话与规划子代理 anchored
          # 引导、规划子代理探查硬上限与只读备份防线、save_plan 注册（主会话层与规划子代理层；
          # 执行者与验收者不可见）、
          # 力度继承（子代理 reasoningEffort = 父会话配置）、子代理沙箱下限、usage 账本。
          - id: extra-plan-group
            name: cordis:group
            group: true
            # 保险项（本仓全 .js/.mjs 零 cordis 服务注册：extends Service / super(ctx, / provide 均 0 命中）：
            # 注册集合为 ∅，任意名满足审计的 ⊇∅；值一律 true（每条目各自 LocalRealm），禁止具名字符串 label。
            isolate:
              extraPlan: true
            config:
              - id: extra-plan
                name: '@local/dsh-extra-plan'
                config:
                  anchoredBootstrap: true
                  creativeMode: false
                  runcodeCatchGate: false
                  bootstrapPersona: '你是一位乐于助人的软件工程师助手，使用简体中文思考和回复。'
                  bootstrapShellTools: [bash, pwsh]
                  bootstrapCommonTools: [read]
                  # F 段（HP 首轮）tool:read 的手写文案（借宿主段名覆盖 text）：空串/非字符串时插件用内置同文案兜底。
                  # 除代码外用中文；四要素必须保留：工具名 read、程序内 tools.read(...) 调用形态、
                  # file_path 必填与 offset（默认 1）/limit（默认 2000）、返回形状（path/offset/totalLines/lines 带行号）。
                  # 文案不再由官方 renderer 生成，与宿主 read 契约（dsh-tool-fs）的人工核对见 pe-test/docs/ai-宿主耦合台账.md HS26。
                  bootstrapReadHint: |-
                    run_code 调用 read 示例：
                    const r = await tools.read({ file_path: 'README.md' })
                    return r
                  # 闸门关键词：唯一人工编辑位置（7 个字段集中于此；改后普通重启即生效，
                  # 旧词不再推进状态机）。persona 正文只引用 {{extra_plan_*}} 变量，不维护第二份词值。
                  # 校验（JS 侧只有 schema 没有默认值）：缺失/非法整组拒绝——插件 apply 同步抛错、
                  # 阻止该预设被使用；非法具体条件=非对象/数组、键集合不等于 7 键、非字符串、空串、
                  # 首尾空白、含 CR/LF、7 值重复、以 (Recommended)/（Recommended）/(推荐)/（推荐）结尾。
                  # 版本升级（dist hash 变化）时整组合法旧值原子迁移；同 hash 普通重启保留现场文件。
                  # 字段 ↔ prompt variable：routeDirect=extra_plan_route_direct、
                  # routePlan=extra_plan_route_plan、routeDisagree=extra_plan_route_disagree、
                  # approvalApprove=extra_plan_approval_approve、approvalReplan=extra_plan_approval_replan、
                  # purposeRefine=extra_plan_purpose_refine、purposeRedo=extra_plan_purpose_redo。
                  gateWords:
                    routeDirect: '直接执行'
                    routePlan: '进行pro规划'
                    routeDisagree: '不同意'
                    approvalApprove: '同意执行'
                    approvalReplan: '转交pro规划'
                    purposeRefine: '完善方案'
                    purposeRedo: '重新规划'
                  # planner 模型名：仅 planner 使用；置空=继承主会话模型；非空且主会话 provider 目录明确不含该模型时
                  # 静默降级为主会话模型（T2 判定：目录为空/取不到目录则保守沿用，目录是 advisory）；
                  # provider/maxTokens 继承父会话。默认值仅在该键缺失时生效（键存在即为用户值）。
                  plannerModel: deepseek-v4-pro
                  # False 保留旧单 provider 目录流程；True 才对 planner 与非 planner child 做串行真实 OK 探针并严格验证 fallback。
                  crossProviderPlannerModel: false
                  planTool: subagent_plan
                  exploreBudget: 18
                  otherAgentModel: ''
                  # 非 planner child（executor/reviewer/probe/workflow/ralph worker）优先使用该模型；空/未匹配/真实探针失败回退主会话。
                  savePlanDir: '.extra-plan'
                  plannerPromptSuffix: '你的深度思考部分需要以"好了，现在我以全局视角来看待这个问题"开头'
                  usageLedger:
                    enabled: true
                    path: !!js dshHomePath('usage-ledger', 'ledger.jsonl')

              # 注：宿主平面组件（extra-plan-settings 设置页 API + settings 命名空间注册、
              # extra-plan-preset-sync 预设自愈核对）不在 agent 预设挂载——settings 命名空间
              # 必须由宿主平面插件注册（settings.service 的 describe() 是「设置→插件→插件配置」
              # 列表的 served 依据，官方插件均如此），且宿主平面注册与 agent 预设注册若同时存在
              # 会触发 duplicate registration；preset-sync 须在 DSH 启动时即核对预设（挂 agent 预设
              # 内则要「预设已就位并开会话」才触发，兜底死锁）。两行均位于插件 bundle patch
              # （cordis.patch.yml insert 列表），随安装自动就位。

          # ── compaction ──────────────────────────────────────────────────────────────

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # subagents 注册表与 spawn/fork 后端在宿主组合（进程单例、provider 名全局唯一）。
          # 本预设贡献委派工具行；executor 薄委托层使用独立 provider 名 'extra-executor-spawn'
          - id: delegation
            name: cordis:group
            group: true
            # subagentModelSelection【必要】：本组四行 dsh-tool-subagent 的插件类即 SubagentModelSelectionConfig
            # extends Service，super(ctx,'subagentModelSelection')——每个实例行各注册一次，未隔离即泄漏到 root realm，
            # 预设挂载抛 'Preset services require isolate realms: subagentModelSelection'。
            # workflowEngine【必要】：组内 workflow-ptc 行实例 PtcWorkflowEngine extends WorkflowEngine，
            # 父类 super(ctx,'workflowEngine')。两键值一律 true（各自 LocalRealm）——四实例同名服务共用具名
            # GlobalRealm 会互相覆盖、破坏各自 config 语义。
            isolate:
              workflowEngine: true
              subagentModelSelection: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              # 执行者（非 planner child）：优先使用 otherAgentModel，空/未匹配/真实探针失败回退主会话；批准后经 subagent 委派。deny 只列本预设实际存在的工具名
              # （R2 教训）；save_plan 注册于主会话层与规划子代理层，执行者与验收者不可见、无需 deny（登记见 SD35）。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: one-shot
                  persona: >-
                    你是一个执行者（executor）。专注高效完成委派的具体任务：prompt 里会给规划方案与验收标准清单的文件路径——先读这两个文件，以文件内容为准执行，不要重新规划整体方案
                    完工前必须自验证：对照验收文件逐项自查，发现问题立即修正后再汇报
                    汇报格式（≤15 行，禁止粘贴大段文件内容）：①完成清单——逐项做了什么、关键结果值；②自验证结论——逐项通过/不通过，附一行证据；③越界需求（如有）
                    权限：审批策略在委派边界被固定为 never——写工作区之外的路径必然被拒绝：不要逐条尝试，更不要设 sandbox_permissions。任务要求写工作区外时，先完成工作区内能做的部分，把越界操作清单（命令、目标路径、用途、预期内容）写进汇报，由主会话统一越界执行
                    使用简体中文思考和回复
                  toolFilter:
                    deny:
                      - subagent
                      - subagent_review
                      - subagent_probe
                      - workflow
                      - ralph
                      - send_message
                      - interrupt_agent
                      - list_agents
                      - ask_user_question
                      - todo_write
                      - subagent_plan
                      - cordis_run

              # 规划子代理（subagent_plan）：只读 + 探查硬上限 + anchored 引导 + save_plan
              # 落盘（save_plan 由 extra-plan 插件在此子会话层注册）。continuable：迭代经
              # send_message 续轮，吃前缀缓存。
              - id: tool-subagent-plan
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_plan
                  backgroundMode: continuable
                  persona: >-
                    你是一个规划子代理（planner）。职责：只读探查 + 产出规划方案与验收标准清单，经 save_plan 落盘；不执行任何任务、不修改任何文件
                    工作方式：
                    1. 读取主会话提供的线索文件，理解现状并确认：是否存在线索不足的情况。如线索不足则自行探查
                    2. 遇到阻塞性关键疑问（影响方案正确性、方向性，且只有用户能回答）：停止当轮、把疑问作为当轮输出（不要猜测）
                    3. 探查预算限制与声明机制：
                       - 探查有预算限制，预算耗尽时：输出「申请继续探查：<待查项> — <原因>」，等主会话探查并转达线索文件路径后，重置预算
                       - 探查完成时：直接调用 save_plan 落盘
                       - 注意：只要存在未探查/待确认项，必须先申请继续探查，不得调用 save_plan
                    4. save_plan 落盘要求：
                       - 调用时机：所有步骤均已探查核实，无未探查项
                       - 一次性落盘两个文件（plan 与 checklist 均为必填参数，缺一不可）
                       - 系统会自动检测未探查项，发现问题会抛错阻止落盘
                    5. 产出内容：
                      - 规划方案：目标、步骤分解（每步：做什么/涉及文件/关键命令）、风险与回滚
                        * 每条已探查核实的步骤标【已探查核实】
                        * 步骤正文保留精确定位信息（位置/行号/数值照实写）
                        * 文档中不应存在未探查或有问题的步骤
                      - 验收标准清单：每条带对应任务编号，形如「[任务N] 文件路径 + 期望值/行号/数值/文案 + 禁止项」
                        * 执行者据此自验证、复核者据此逐条核对
                        * 保持机械精确：路径/行号/数值照实写
                      - 证据引用：须引用头部含「探查证据报告」的文件，并注明「证据：<文件路径>」；不带 evidence 落盘的《探查线索》引用会报错
                    6. save_plan 结束后在输出中给出两个文件路径
                    7. 回报机制：save_plan 落盘成功后，用 send_message 向主会话简短回报结果（2-3 行摘要：方案文件路径、验收文件路径、涉及文件数、步骤数）
                    使用简体中文思考和回复
                  toolFilter:
                    deny:
                      - subagent
                      - subagent_review
                      - subagent_probe
                      - workflow
                      - ralph
                      - interrupt_agent
                      - list_agents
                      - ask_user_question
                      - todo_write
                      - write
                      - edit
                      - subagent_plan
                      - cordis_run

              # 验收复核者（subagent_review）：只读验收文件逐条核对，≤20 行结论。
              - id: tool-subagent-review
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_review
                  backgroundMode: one-shot
                  persona: >-
                    你是一个验收复核者（reviewer）。唯一职责：按「验收」文件（prompt 给的路径）逐条机械核对执行者产出是否达标（文件是否存在、行号/数值/文案是否与清单一致、是否出现清单外的意外改动）。以文件内容为准，只读不写、不规划、不代执行任务。输出格式：逐项「通过/不通过 + 一行证据」，最后一行给总结论「验收通过」或「验收不通过：N 项问题」；全文 ≤20 行，简体中文思考和回复
                  toolFilter:
                    deny:
                      - subagent
                      - subagent_review
                      - subagent_probe
                      - workflow
                      - ralph
                      - send_message
                      - interrupt_agent
                      - list_agents
                      - ask_user_question
                      - todo_write
                      - write
                      - edit
                      - subagent_plan
                      - cordis_run

              # 探查子代理（非 planner child）：优先使用 otherAgentModel，空/未匹配/真实探针失败回退顶层主会话；只读探查 + save_probe 落盘【含证据报告】
              # one-shot（不可续轮）；模型由非 planner resolver 处理（不配 agentOptions，显式指定优先）
              - id: tool-subagent-probe
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_probe
                  backgroundMode: one-shot
                  persona: >-
                    你是一个探查子代理（probe）。只读探查，不执行任务、不修改任何文件
                    工作方式：
                    1. 只读探查（read/glob/grep/web_search、shell 只读命令（Windows 用 pwsh、Linux/macOS 用 bash））理解现状；只探查任务明确要求的范围，不无目的扩散（不逐目录翻、不重复验证同一问题）。不执行任务、不修改任何文件
                    2. 探查完成：用 save_probe 落盘【含证据报告】——把核实过的行号/数值/文案照实写进落盘文件（不概括不改写），主会话与规划子代理可将其作为【探查者已核实】证据引用；落盘前自查：path 必须真实存在、range 格式 12 或 L12-34、evidence.line 单个行号（不含区间）、每项 evidence 须 line/value/text 至少其一，超出工具描述上限先压缩或分批落盘 
                    3. 回报机制：save_probe 落盘成功后，向主会话简短回报结果（2-3 行摘要 + 线索文件path路径）
                    4. 使用简体中文思考和回复
                  toolFilter:
                    deny:
                      - subagent
                      - subagent_review
                      - subagent_probe
                      - workflow
                      - ralph
                      - send_message
                      - interrupt_agent
                      - list_agents
                      - ask_user_question
                      - todo_write
                      - subagent_plan
                      - write
                      - edit
                      - cordis_run

              # executor-spawn 薄委托层：
              # workflow/ralph worker 请求缺 toolFilter 时注入执行者 deny（12 项，含
              # subagent_plan 防 worker 再规划、含 subagent_probe 防 worker 委派探查者；
              # save_plan 不可见无需列）；模型不在薄层注入，worker 由非 planner resolver 选择 otherAgentModel
              # 或回退顶层主会话（请求显式指定 provider/model 时优先）。
              - id: executor-spawn
                name: '@local/dsh-extra-plan/executor-spawn'
                config:
                  providerName: extra-executor-spawn
                  delegate: spawn
                  deny:
                    - subagent
                    - subagent_review
                    - subagent_probe
                    - workflow
                    - ralph
                    - send_message
                    - interrupt_agent
                    - list_agents
                    - ask_user_question
                    - todo_write
                    - subagent_plan
                    - cordis_run

              # 0.1.7：旧的 worker-thread 工作流行（worker-thread 替身包）整包消失，替身为 dsh-workflow-ptc
              # （其行实例 PtcWorkflowEngine 继承 dsh-workflow 的 WorkflowEngine，仍注册 workflowEngine，
              # 由本组 isolate.workflowEngine 覆盖）；provider 保留本仓自定义薄委托层名。
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: extra-executor-spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: extra-executor-spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          # ['native','ptc','both']
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: native

          # ── cordis（官方创造模式工具集，只读引用官方包） ──────────────────────────

          # 7 工具：cordis_inspect_list/query/self 只读；cordis_define 只存源码+语法校验、
          # 不执行；cordis_stop/cordis_undefine 无对象可操作。cordis_run 是唯一执行口
          # （模型 JS 求值+挂载临时插件，纯内存、会话级、重启即失）——主会话由插件硬闸门
          # 按 write/edit 同规则管控（路由未确认拒绝、批准/直行放行）；执行者/规划/验收/
          # 探查四子代理由 toolFilter.deny 禁 cordis_run，其余 cordis 工具放行。
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'

