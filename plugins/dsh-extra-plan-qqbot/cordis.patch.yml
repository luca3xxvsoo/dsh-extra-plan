# 精简版：静态 insert 注册依赖+mklink；旧版错误块由 heal 迁移；问答/审批以 dsh-qqbot 0.5.2 为目标原生承担，真实效果仍 HUMAN。
# DSH_COMPAT_RC1：rc.1兼容（仅兼容加载声明，不归共享安全核心）；删除边界：须另行授权，并保留共享安全回归。
# DSH_CURRENT_RC2：rc.2当前目标；当前兼容并集为 0.2.2-rc.1 || 0.2.2-rc.2；QQBot目标 0.5.2；删除边界：撤销rc.1前须保留rc.2/共享安全回归。
# 真实 QQBot 部署、消息链与宿主效果由用户按实机流程复测；静态 insert 注册数据不证明已部署。
# 增加而不是覆盖
- insert:
    - id: qqbot-user-questions
      name: 'dsh-extra-plan-qqbot'
    # 旧 code-runtime 行（worker-thread 族的 code-runtime 包）已消失，
    # 等价行 = ptc-runtime（dsh-base 同形行：id: ptc-runtime / name:
    # '@deepseek-ai/dsh-ptc-runtime-node'，提供 ctx.ptcRuntime）。
    # 若目标 qqbot 宿主的基础组合已带该行，本行须删除以免重复注册。
    - id: ptc-runtime
      name: '@deepseek-ai/dsh-ptc-runtime-node'
    # 旧 agent-presets 行（复数包）已消失，替身 = dsh-agent-preset-registry
    # （Config{default, selectedDefault}；modeSelectionEnabled 已从该行契约删除，勿再写；
    # 预设声明行由各 bundle patch 提供）。
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: extra-plan
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'
    - id: dsh-extra-plan-settings
      name: 'dsh-extra-plan/settings'
